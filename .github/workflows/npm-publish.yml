name: Publish npm packages

on:
  push:
    branches: [main]
    paths:
      - 'apps/cli/**'
      - 'packages/core/**'
      - 'scripts/npm-*.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/npm-publish.yml'
  pull_request:
    paths:
      - 'apps/cli/**'
      - 'packages/core/**'
      - 'scripts/npm-*.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/npm-publish.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
        with:
          version: 12.6.0
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tests and packed npm installation
        run: pnpm test:release

  publish:
    needs: validate
    if: github.repository == 'Humanive/Learn' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
        with:
          version: 12.6.0
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare automatic version
        run: node scripts/npm-release.mjs prepare

      - name: Build CLI and core
        run: pnpm build:cli

      - name: Verify packed release installation
        run: node scripts/npm-smoke.mjs

      - name: Install npm with OIDC support
        run: npm install -g npm@11.9.0

      - name: Publish core then CLI
        run: node scripts/npm-release.mjs publish
