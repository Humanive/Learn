name: Validate GitHub importer

on:
  push:
    branches: [main]
    paths:
      - 'scripts/github-import*.mjs'
      - 'docs/github-import.md'
      - '.github/workflows/github-import*.yml'
  pull_request:
    paths:
      - 'scripts/github-import*.mjs'
      - 'docs/github-import.md'
      - '.github/workflows/github-import*.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Test the importer
        run: node --test scripts/github-import.test.mjs
